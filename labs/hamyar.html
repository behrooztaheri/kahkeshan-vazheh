<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>همیار درس</title>
<style>*{box-sizing:border-box}
body{margin:0;background:#eef2ff;color:#241a52;font-family:Tahoma,sans-serif}
header{background:#2a1a6e;color:#fff;padding:12px 18px}
header h1{margin:0;font-size:24px}header p{margin:3px 0 0;font-size:14px;opacity:.9}
main{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;padding:14px;max-width:1040px;margin:auto}
.panel{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 8px #0002}
h2{font-size:16px;margin:0 0 8px}
#chat{height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.msg{padding:9px 12px;border-radius:14px;max-width:88%;line-height:1.7;font-size:15px}
.me{align-self:flex-start;background:#e6dcff}.bot{align-self:flex-end;background:#e6faee}
.bar{display:flex;gap:8px;margin-top:10px}
input,textarea{flex:1;font:inherit;padding:9px;border:1px solid #99a;border-radius:10px}
textarea{width:100%;height:112px;resize:vertical;margin-bottom:10px;font-size:14px;line-height:1.7}
button{font:inherit;padding:9px 16px;border:0;border-radius:10px;background:#6c3fe0;color:#fff;cursor:pointer}
.step{font-size:14px;padding:6px 8px;background:#f4f2fb;border-radius:8px;margin-bottom:5px;line-height:1.6}
.step b{color:#6c3fe0}small{display:block;text-align:center;color:#556;padding:0 12px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips button{background:#efebff;color:#2a1a6e;padding:5px 10px;font-size:13px}
@media(max-width:760px){main{grid-template-columns:1fr}}
</style></head><body>
<header><h1>همیار درس</h1><p>مینی‌عامل مطالعه: فقط از متن درس جواب می‌دهد و منبع جوابش را نشان می‌دهد.</p></header>
<main>
<section class="panel"><h2>متن درس</h2>
<textarea id="doc">قنات راهی زیرزمینی برای آوردن آب است. آب در قنات با شیب ملایم به سمت پایین حرکت می‌کند. چاه‌های پشت سر هم برای کندن و نگهداری قنات ساخته می‌شوند. قنات در مناطق خشک ایران قرن‌ها استفاده شده است. قنات‌های ایرانی در فهرست میراث جهانی یونسکو ثبت شده‌اند.</textarea>
<h2>گفتگو</h2><div id="chat" style="height:190px"></div>
<div class="bar"><input id="q" placeholder="سؤالت را بپرس یا بگو: سه سؤال بساز"><button id="go">بفرست</button></div>
<div class="chips"><button data-q="چرا چاه‌ها ساخته می‌شوند؟">سؤال از متن</button><button data-q="اولین قنات کی ساخته شد؟">سؤال بیرون از متن</button><button data-q="سه سؤال بساز">ساخت آزمون</button></div></section>
<section class="panel"><h2>مغز عامل چه کرد؟</h2><div id="trace"></div></section>
</main>
<small>نسخه آموزشی بدون اینترنت و بدون مدل زبانی. جستجو با شباهت کلمه‌ها انجام می‌شود و متن از این صفحه بیرون نمی‌رود.</small>
<script>// Shared mini-agent shell: chat, visible trace, and helpers. Runs fully offline.
const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
const norm = (t) => t.replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/‌/g, ' ');
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function bubble(cls, html) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = html; $('chat').appendChild(d); $('chat').scrollTop = 1e6; }
function trace(step, text) { const d = document.createElement('div'); d.className = 'step'; d.innerHTML = '<b>' + step + '</b> ' + esc(text); $('trace').appendChild(d); }
// Safety rules shared by both agents; they run before anything else.
function guard(t) {
  if (/رمز|شماره کارت|کد ملی|شماره تلفن|شماره بابا|شماره مامان|موبایل|آدرس خونه|آدرس خانه|نشانی خانه|نشانی خونه/.test(t)) return 'لطفاً رمز، شماره تلفن یا نشانی را اینجا ننویس. برای کار من لازم نیست و بهتر است خصوصی بماند.';
  if (/فراموش کن|نادیده بگیر|دستورها?ت|دستور سیستم/.test(t)) return 'نمی‌توانم دستورهایم را کنار بگذارم. اما خوشحال می‌شوم در کار خودم کمکت کنم.';
  return null;
}
function wire(run) {
  const send = () => { const q = $('q').value.trim(); if (!q) return; $('q').value = ''; $('trace').innerHTML = ''; bubble('me', esc(q)); const t = norm(q); trace('دریافت:', 'پیام خوانده شد.'); const g = guard(t); if (g) { trace('نگهبان:', 'مرز ایمنی فعال شد؛ هیچ ابزاری اجرا نشد.'); bubble('bot', g); return; } trace('نگهبان:', 'پیام امن است.'); bubble('bot', run(t)); };
  $('go').onclick = send; $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
}
</script>
<script>
const STOP = new Set(['چرا', 'چه', 'کی', 'کجا', 'چطور', 'چگونه', 'آیا', 'است', 'هست', 'هستند', 'را', 'در', 'از', 'به', 'با', 'و', 'برای', 'که', 'می', 'شد', 'شده', 'شوند', 'میشوند', 'ساخته']);
const words = (s) => norm(s).replace(/[؟?.,،:!«»]/g, ' ').split(/\s+/).filter((w) => w.length > 1 && !STOP.has(w));
const stem = (w) => w.replace(/(ها|های|هایی)$/, '');
const tools = {
  split: (d) => d.split(/[.؟!]\s*/).map((x) => x.trim()).filter(Boolean),
  search(q, sents) { const ws = new Set(words(q).map(stem)); let best = null, score = 0; for (const s of sents) { const n = words(s).map(stem).filter((w) => ws.has(w)).length; if (n > score) { score = n; best = s; } } return { best, score, need: ws.size }; },
  quiz(sents) { return sents.slice(0, 3).map((s, i) => { const w = s.split(/\s+/).filter((x) => !STOP.has(norm(x))).sort((a, b) => b.length - a.length)[0]; return fa(i + 1) + '. ' + s.replace(w, '......'); }); },
};
function run(t) {
  if (/جواب امتحان|تکلیف(م|ام)? رو بنویس|جای من/.test(t)) { trace('تصمیم:', 'این کار یادگیری را از بین می‌برد.'); return 'تکلیف را به‌جای تو انجام نمی‌دهم. ولی با هم متن را می‌خوانیم و سؤال تمرینی می‌سازیم.'; }
  const sents = tools.split($('doc').value); trace('ابزار خواندن متن:', fa(sents.length) + ' جمله پیدا شد.');
  if (!sents.length) return 'اول متن درس را بنویس.';
  if (/سوال بساز|سؤال بساز|آزمون|امتحان بگیر/.test(t)) { const q = tools.quiz(sents); trace('ابزار ساخت آزمون:', fa(q.length) + ' سؤال جای‌خالی ساخته شد.'); return 'جای خالی را پر کن:<br>' + q.join('<br>'); }
  const r = tools.search(t, sents); trace('ابزار جستجو:', 'امتیاز شباهت ' + r.score);
  if (r.score < 2 && !(r.need === 1 && r.score === 1)) { trace('تصمیم:', 'جمله مطمئنی پیدا نشد؛ حدس نمی‌زنم.'); return 'این در متن نیامده.'; }
  trace('بررسی:', 'جواب از یک جمله متن آمده است.');
  return 'طبق متن: <b>' + r.best + '.</b>';
}
wire(run);
document.querySelectorAll('.chips button').forEach((b) => (b.onclick = () => { $('q').value = b.dataset.q; $('go').click(); }));
bubble('bot', 'سلام! از متن درس سؤال بپرس.');
</script></body></html>
